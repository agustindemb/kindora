version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kindora_postgres
    restart: always
    environment:
      POSTGRES_DB: kindora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
